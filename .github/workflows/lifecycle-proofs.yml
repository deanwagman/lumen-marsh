name: lifecycle-proofs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: lifecycle-proofs
  cancel-in-progress: true

jobs:
  compose-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: lumen-marsh-platform
    steps:
      - uses: actions/checkout@v4
      - name: Install Compose environment
        working-directory: ${{ github.workspace }}
        run: cp lumen-marsh-platform/.env.example lumen-marsh-platform/.env
      - name: Set NWS user agent from Actions secret
        env:
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: |
          set -euo pipefail
          nws_user_agent="${NWS_USER_AGENT:-}"
          if [[ -z "${nws_user_agent//[[:space:]]/}" ]]; then
            echo "error: Actions secret NWS_USER_AGENT is empty" >&2
            exit 1
          fi
          case "${nws_user_agent}" in
            *you@example.com*|*replace-with-contact*)
              echo "error: Actions secret NWS_USER_AGENT is still a placeholder" >&2
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ["NWS_USER_AGENT"]
          if "\n" in value or "\r" in value:
              raise SystemExit("error: Actions secret NWS_USER_AGENT must be a single line")
          path = Path(".env")
          if not path.is_file():
              raise SystemExit("error: .env is missing after copying .env.example")
          lines = path.read_text().splitlines()
          replaced = False
          updated = []
          for line in lines:
              if line.startswith("NWS_USER_AGENT="):
                  updated.append(f"NWS_USER_AGENT={value}")
                  replaced = True
              else:
                  updated.append(line)
          if not replaced:
              raise SystemExit("error: NWS_USER_AGENT is missing from .env")
          path.write_text("\n".join(updated) + "\n")
          PY
      - name: Start Compose stack
        run: ./scripts/dev-up.sh
      - name: Storm lifecycle
        run: ./scripts/storm-lifecycle-acceptance.sh
      - name: Maintenance lifecycle
        run: ./scripts/maintenance-lifecycle-acceptance.sh
      - name: Flow lifecycle
        run: ./scripts/flow-lifecycle-acceptance.sh
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p lumen-marsh logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: ./scripts/dev-down.sh
