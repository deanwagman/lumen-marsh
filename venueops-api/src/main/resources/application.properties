spring.application.name=venueops-api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
venueops.attractions.persistence=memory
venueops.attractions.seed=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
venueops.attractions.sse.timeout-ms=1800000
venueops.attractions.sse.heartbeat-interval-ms=15000
venueops.attractions.sse.reconnect-ms=3000
# LOCAL_JWT keeps automated tests and local Compose offline. Demo/prod must set OIDC + Cognito issuer.
venueops.security.mode=${VENUEOPS_SECURITY_MODE:LOCAL_JWT}
venueops.security.issuer-uri=${VENUEOPS_ISSUER_URI:http://venueops.local/test}
# Cognito access tokens bind the caller with client_id, not a resource-server aud claim.
venueops.security.allowed-client-ids=${VENUEOPS_ALLOWED_CLIENT_IDS:venueops-console-local,environmental-monitor-local,reliability-integration-local}
venueops.security.expose-api-docs=${VENUEOPS_SECURITY_EXPOSE_API_DOCS:false}
venueops.security.allowed-origins=${VENUEOPS_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# 0 disables the limiter (automated tests that need unbounded ingest). Default 120/min.
venueops.security.weather-ingest-rate-limit-per-minute=${VENUEOPS_WEATHER_INGEST_RATE_LIMIT_PER_MINUTE:120}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${VENUEOPS_SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${VENUEOPS_SPRINGDOC_ENABLED:false}
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
