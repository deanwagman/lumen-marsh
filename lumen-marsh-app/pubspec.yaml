name: lumen_marsh_app
description: "Guest companion for Lumen Marsh, an eco-futurist wetlands destination."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/field_guide/entries.json
    - assets/field_guide/images/
