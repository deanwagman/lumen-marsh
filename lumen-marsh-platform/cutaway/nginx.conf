server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 http://localhost:8000 http://127.0.0.1:8000 http://localhost:8100 http://127.0.0.1:8100 http://localhost:8200 http://127.0.0.1:8200; frame-src http://localhost:3000 http://127.0.0.1:3000 http://localhost:3001 http://127.0.0.1:3001" always;

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        try_files /health =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
