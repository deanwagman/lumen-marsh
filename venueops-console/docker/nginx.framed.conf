# Local image only. The runtime stage installs this file when
# CONSOLE_FRAME_ANCESTORS is set. compose.yaml does not pass that argument,
# so docker/nginx.conf (DENY, frame-ancestors 'none') stays the production config.
#
# Document responses omit the legacy frame-deny header, because it would blank
# the Cutaway iframe even when frame-ancestors lists the booth. /health stays denied.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP wildcards are only valid in the left-most hostname label. Use the
    # exact regional Cognito discovery/JWKS host instead of cognito-idp.*.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors __CONSOLE_FRAME_ANCESTORS__; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:* https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com" always;

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /health =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
